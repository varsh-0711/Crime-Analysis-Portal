# Render blueprint (template) - update the two URLs after the first deploy.
services:
  - type: web
    name: crime-portal-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: POLICE_CODE
        value: POL-2026
      - key: CORS_ORIGINS
        value: https://crime-portal-web.onrender.com
      - key: DATA_FILE
        value: /data/db.json
    disk:
      name: portal-data
      mountPath: /data
      sizeGB: 1

  - type: web
    name: crime-portal-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://crime-portal-api.onrender.com
